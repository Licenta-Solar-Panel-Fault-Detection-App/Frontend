<div class="modal-backdrop">
  <div class="modal">
    <h2>Edit this Solar Panel</h2>

    <form [formGroup]="panelForm" (ngSubmit)="submit()">
      <div class="form-group">
        <label for="name">Panel Name</label>
        <input id="name" type="text" formControlName="name" />
      </div>

      <div class="form-group">
        <label for="latitude">Latitude</label>
        <input id="latitude" type="number" formControlName="latitude" />
      </div>

      <div class="form-group">
        <label for="longitude">Longitude</label>
        <input id="longitude" type="number" formControlName="longitude" />
      </div>

      <div class="modal-actions">
        <button type="submit" class="btn-submit" [disabled]="panelForm.invalid || !panelForm.dirty">Submit</button>
        <button type="button" class="btn-cancel" (click)="cancel()">Cancel</button>
      </div>
    </form>
  </div>
</div>
